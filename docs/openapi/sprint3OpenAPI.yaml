openapi: 3.1.0

info:
  title: EthiopiaHub Images API
  version: 1.3.0
  description: |
    Sprint 3 Community & User Content API.

    This sprint introduces:

      • Image Likes
      • Image Favorites
      • Download Tracking
      • Contributor Public Profile
      • Contributor Portfolio

servers:
  - url: http://localhost:5000/api/v1
    description: Local Development

tags:
  - name: Likes
    description: Image like operations

  - name: Favorites
    description: Image favorite operations

  - name: Downloads
    description: Download tracking

  - name: Profiles
    description: Contributor public profile

security:
  - bearerAuth: []

paths:
  /images/{imageId}/likes:

    post:
      tags:
        - Likes

      summary: Like an image

      operationId: likeImage

      security:
        - bearerAuth: []

      parameters:
        - $ref: '#/components/parameters/ImageId'

      responses:
        "201":
          description: Image liked successfully

        "401":
          $ref: '#/components/responses/Unauthorized'

        "404":
          $ref: '#/components/responses/ImageNotFound'

        "409":
          description: Image already liked

    delete:
      tags:
        - Likes

      summary: Remove image like

      operationId: unlikeImage

      security:
        - bearerAuth: []

      parameters:
        - $ref: '#/components/parameters/ImageId'

      responses:
        "204":
          description: Like removed

        "401":
          $ref: '#/components/responses/Unauthorized'

        "404":
          description: Like not found
            /images/{imageId}/favorites:

    post:
      tags:
        - Favorites

      summary: Add image to favorites

      operationId: favoriteImage

      security:
        - bearerAuth: []

      parameters:
        - $ref: '#/components/parameters/ImageId'

      responses:
        "201":
          description: Image added to favorites

        "401":
          $ref: '#/components/responses/Unauthorized'

        "404":
          $ref: '#/components/responses/ImageNotFound'

        "409":
          description: Image already favorited

    delete:
      tags:
        - Favorites

      summary: Remove image from favorites

      operationId: unfavoriteImage

      security:
        - bearerAuth: []

      parameters:
        - $ref: '#/components/parameters/ImageId'

      responses:
        "204":
          description: Favorite removed

        "401":
          $ref: '#/components/responses/Unauthorized'

        "404":
          description: Favorite not found
            /downloads/{imageId}:

    post:
      tags:
        - Downloads

      summary: Download an image

      operationId: downloadImage

      security: []

      parameters:
        - $ref: '#/components/parameters/ImageId'

      responses:
        "200":
          description: Download successful

          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DownloadResponse'

        "403":
          description: Download not permitted

        "404":
          $ref: '#/components/responses/ImageNotFound'

  /downloads/history:

    get:
      tags:
        - Downloads

      summary: Get authenticated user's download history

      operationId: getDownloadHistory

      security:
        - bearerAuth: []

      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'

      responses:
        "200":
          description: Download history

          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DownloadHistoryResponse'

        "401":
          $ref: '#/components/responses/Unauthorized'
            /profiles/{username}:

    get:
      tags:
        - Profiles

      summary: Get public contributor profile

      operationId: getContributorProfile

      security: []

      parameters:
        - $ref: '#/components/parameters/Username'

      responses:
        "200":
          description: Contributor profile

          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicProfileResponse'

        "404":
          description: Contributor not found

  /profiles/{username}/images:

    get:
      tags:
        - Profiles

      summary: Get contributor portfolio

      operationId: getContributorPortfolio

      security: []

      parameters:
        - $ref: '#/components/parameters/Username'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'

      responses:
        "200":
          description: Contributor portfolio

          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PortfolioResponse'

        "404":
          description: Contributor not found
          components:

  securitySchemes:

    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:

    ImageId:
      name: imageId
      in: path
      required: true

      schema:
        type: string
        format: uuid

    Username:
      name: username
      in: path
      required: true

      schema:
        type: string

    Page:
      name: page
      in: query

      schema:
        type: integer
        minimum: 1
        default: 1

    PageSize:
      name: pageSize
      in: query

      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
          schemas:

    ApiResponse:
      type: object

      properties:

        status:
          type: string
          example: success

        message:
          type: string

        data:
          type: object

        metadata:
          type: object

    ErrorResponse:
      type: object

      properties:

        status:
          type: string
          example: error

        errorCode:
          type: string

        message:
          type: string

        requestId:
          type: string

        timestamp:
          type: string
          format: date-time

    Pagination:

      type: object

      properties:

        page:
          type: integer

        pageSize:
          type: integer

        totalItems:
          type: integer

        totalPages:
          type: integer

        hasNextPage:
          type: boolean

        hasPreviousPage:
          type: boolean

    DownloadResponse:

      type: object

      properties:

        downloadUrl:
          type: string
          format: uri

        fileName:
          type: string

        expiresAt:
          type: string
          format: date-time

    DownloadHistoryItem:

      type: object

      properties:

        id:
          type: string
          format: uuid

        imageId:
          type: string
          format: uuid

        title:
          type: string

        downloadedAt:
          type: string
          format: date-time

    DownloadHistoryResponse:

      type: object

      properties:

        items:

          type: array

          items:
            $ref: '#/components/schemas/DownloadHistoryItem'

        pagination:
          $ref: '#/components/schemas/Pagination'

    PublicProfile:

      type: object

      properties:

        id:
          type: string
          format: uuid

        username:
          type: string

        displayName:
          type: string

        bio:
          type: string

        avatarUrl:
          type: string
          format: uri

        joinedAt:
          type: string
          format: date-time

        statistics:

          type: object

          properties:

            totalUploads:
              type: integer

            totalDownloads:
              type: integer

            totalLikes:
              type: integer

            totalFavorites:
              type: integer

    PublicProfileResponse:

      type: object

      properties:

        profile:
          $ref: '#/components/schemas/PublicProfile'

    PortfolioImage:

      type: object

      properties:

        id:
          type: string
          format: uuid

        title:
          type: string

        thumbnailUrl:
          type: string
          format: uri

        category:
          type: string

        likes:
          type: integer

        downloads:
          type: integer

        createdAt:
          type: string
          format: date-time

    PortfolioResponse:

      type: object

      properties:

        items:

          type: array

          items:
            $ref: '#/components/schemas/PortfolioImage'

        pagination:
          $ref: '#/components/schemas/Pagination'
            responses:

    Unauthorized:

      description: Authentication required

      content:

        application/json:

          schema:
            $ref: '#/components/schemas/ErrorResponse'

    ImageNotFound:

      description: Image not found

      content:

        application/json:

          schema:
            $ref: '#/components/schemas/ErrorResponse'